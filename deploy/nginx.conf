# Configuración Nginx como reverse proxy para CompraÁgil API
# Coloca este archivo en /etc/nginx/sites-available/compra-agil
# Luego: ln -s /etc/nginx/sites-available/compra-agil /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name tu-dominio.com;          # ← Cambiar por tu dominio o IP

    # Redirigir HTTP → HTTPS (habilitar después de certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts (el scraping puede tardar)
        proxy_read_timeout  300s;
        proxy_connect_timeout 75s;
    }

    # Logs
    access_log /var/log/nginx/compra-agil-access.log;
    error_log  /var/log/nginx/compra-agil-error.log;
}

